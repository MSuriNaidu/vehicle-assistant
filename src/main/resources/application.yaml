spring:
  application:
    name: vehicle-assistant

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

langchain4j:
  open-ai:
    chat-model:
      base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENAI_API_KEY}
      model-name: 'openrouter/free'
      temperature: 0.7
      max-retries: 5
      timeout: 90s
      log-requests: false
      log-responses: false