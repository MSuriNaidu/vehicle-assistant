spring:
  application:
    name: vehicle-assistant

langchain4j:
  open-ai:
    chat-model:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENAI_API_KEY}
      model-name: 'openrouter/free'
      temperature: 0.7
      max-retries: 5
      timeout: 90s
      log-requests: false
      log-responses: false