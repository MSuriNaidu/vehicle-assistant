spring:
  application:
    name: vehicle-assistant

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

vigidrive:
  safety:
    dangerous-dtc-codes: ${SAFETY_DANGEROUS_DTC_CODES:P0217}
